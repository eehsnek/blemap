<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Details</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #131313;
      --surface-container: #1c1b1b;
      --surface-container-high: #201f1f;
      --surface-container-low: #2a2a2a;
      --primary: #ffb779;
      --primary-container: #cd7f32;
      --secondary: #43e2d2;
      --on-surface: #e5e2e1;
      --on-surface-muted: #b8b6b2;
      --ghost-border: rgba(83,68,56,0.15);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at top left, rgba(67,226,210,0.12), transparent 28%),
                  linear-gradient(180deg, #101010 0%, #121212 100%);
      color: var(--on-surface);
    }

    body {
      padding: 32px;
    }

    .case-detail-wrapper {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .back-button {
      align-self: flex-start;
      padding: 14px 22px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-container));
      color: #101010;
      cursor: pointer;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .back-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .case-card {
      padding: 32px;
      border-radius: 32px;
      background: rgba(21,20,20,0.96);
      box-shadow: 0 24px 80px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,183,121,0.12);
      backdrop-filter: blur(20px);
    }

    .case-card__header {
      display: grid;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .case-title {
      margin: 0;
      font-size: clamp(2rem, 2.5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .case-summary {
      margin: 0;
      color: var(--on-surface-muted);
      max-width: 88%;
      font-size: 1rem;
      line-height: 1.75;
    }

    .case-meta {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--secondary);
      font-weight: 700;
      text-transform: uppercase;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .stat-card {
      padding: 22px;
      border-radius: 26px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(18px);
    }

    .stat-card strong {
      display: block;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--on-surface-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-note {
      color: var(--on-surface-muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .section-card {
      margin-top: 32px;
      display: grid;
      gap: 18px;
    }

    .section-heading {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .posts-list,
    .solutions-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .posts-list li,
    .solutions-list li {
      padding: 16px 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      transition: transform 180ms ease, background 180ms ease;
    }

    .posts-list li:hover,
    .solutions-list li:hover {
      transform: translateY(-1px);
      background: rgba(67,226,210,0.06);
    }

    .posts-list a {
      color: var(--secondary);
      text-decoration: none;
      word-break: break-all;
    }

    .posts-list a:hover {
      text-decoration: underline;
    }

    .solution-card {
      display: grid;
      gap: 14px;
      padding: 22px;
      border-radius: 28px;
      background: rgba(67,226,210,0.08);
      border: 1px solid rgba(67,226,210,0.18);
    }

    .solution-card--accepted {
      background: rgba(255,183,121,0.12);
      border-color: rgba(255,183,121,0.28);
    }

    .solution-card p {
      margin: 0;
      line-height: 1.7;
    }

    .solution-meta {
      color: var(--on-surface-muted);
      font-size: 0.95rem;
    }

    .solution-status {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #9bedc7;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }

    .button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, filter 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button--primary {
      background: linear-gradient(135deg, rgba(255,183,121,0.98), rgba(205,127,50,0.98));
      color: #101010;
    }

    .button--secondary {
      background: rgba(67,226,210,0.12);
      color: var(--secondary);
    }

    .button--accent {
      background: rgba(255,183,121,0.12);
      color: var(--primary);
    }

    .solution-input {
      width: 100%;
      min-height: 140px;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--on-surface);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .solution-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,183,121,0.12);
      background: rgba(255,255,255,0.05);
    }

    @media (max-width: 720px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .case-card {
        padding: 24px;
      }

      .button-row {
        justify-content: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="case-detail-wrapper">
    <button onclick="history.back()" class="back-button">← Back to Home</button>
    <div id="case-details"></div>
  </div>
  <script type="module" src="caseDetail.js" defer></script>
</body>
</html>
