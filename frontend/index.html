<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BleMap | Problem Matrix</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e5e2e1",
                        "primary-fixed": "#ffdcc1",
                        "on-surface": "#e5e2e1",
                        "error-container": "#93000a",
                        "surface-container-high": "#2a2a2a",
                        "on-surface-variant": "#d8c2b2",
                        "on-secondary-container": "#004c46",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#753401",
                        "on-tertiary-fixed": "#321200",
                        "on-primary-fixed-variant": "#6c3a00",
                        "surface-variant": "#353534",
                        "tertiary-container": "#d17c46",
                        "on-secondary-fixed": "#00201d",
                        "inverse-surface": "#e5e2e1",
                        "tertiary": "#ffb68c",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed-variant": "#005049",
                        "secondary-fixed": "#61f9e9",
                        "on-tertiary": "#532200",
                        "surface-tint": "#ffb779",
                        "surface-container": "#201f1f",
                        "primary": "#ffb779",
                        "on-tertiary-container": "#491e00",
                        "surface-dim": "#131313",
                        "tertiary-fixed": "#ffdbc9",
                        "outline": "#a18d7f",
                        "on-primary-container": "#432200",
                        "inverse-on-surface": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "secondary-fixed-dim": "#3adccc",
                        "tertiary-fixed-dim": "#ffb68c",
                        "on-primary": "#4c2700",
                        "outline-variant": "#534438",
                        "primary-fixed-dim": "#ffb779",
                        "inverse-primary": "#8e4e00",
                        "error": "#ffb4ab",
                        "secondary": "#43e2d2",
                        "surface-container-highest": "#353534",
                        "secondary-container": "#00c6b6",
                        "on-secondary": "#003732",
                        "on-primary-fixed": "#2e1500",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "surface-bright": "#393939",
                        "primary-container": "#cd7f32"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-[#131313] flex justify-between items-center px-8 py-4 w-full h-16">
        <div class="flex items-center gap-8">
            <span class="text-2xl font-['Noto_Serif'] italic text-[#ffb779]">BleMap</span>
            <nav class="hidden md:flex gap-6">
                <a class="font-['Noto_Serif'] font-bold text-lg tracking-tight text-[#43e2d2]" href="#">Matrix</a>
                <a class="font-['Noto_Serif'] font-bold text-lg tracking-tight text-[#e5e2e1] opacity-70 hover:opacity-100 hover:text-[#43e2d2] transition-colors cursor-pointer" href="case_submission.html">Submit Case</a>
                <a class="font-['Noto_Serif'] font-bold text-lg tracking-tight text-[#e5e2e1] opacity-70 hover:opacity-100 hover:text-[#43e2d2] transition-colors cursor-pointer" href="#">Archives</a>
            </nav>
        </div>
        <div class="flex items-center gap-4 text-[#ffb779]">
            <button id="refreshBtn" class="material-symbols-outlined cursor-pointer active:scale-95 duration-200" title="Refresh Matrix">refresh</button>
            <span class="material-symbols-outlined cursor-pointer active:scale-95 duration-200">account_circle</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-16 min-h-screen bg-surface">
        <div class="max-w-7xl mx-auto px-8 py-8">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="font-headline text-4xl font-bold text-on-surface mb-2">Problem Matrix</h1>
                <p class="font-body text-on-surface-variant">Validated problems mapped by pain level and solution gap</p>
            </div>

            <!-- Matrix Container -->
            <div class="bg-surface-container rounded-xl p-8 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-headline text-xl font-bold text-primary">Active Cases</h2>
                    <div class="flex gap-4">
                        <button id="viewModeBtn" class="px-4 py-2 bg-surface-container-high text-on-surface rounded-lg hover:bg-surface-container-low transition-colors">
                            <span class="material-symbols-outlined text-sm mr-1">grid_view</span>
                            Matrix View
                        </button>
                        <button id="listModeBtn" class="px-4 py-2 bg-surface-container-high text-on-surface rounded-lg hover:bg-surface-container-low transition-colors">
                            <span class="material-symbols-outlined text-sm mr-1">list</span>
                            List View
                        </button>
                    </div>
                </div>

                <!-- Cases Container -->
                <div id="casesContainer" class="min-h-[400px]">
                    <div class="flex items-center justify-center py-16">
                        <div class="text-center">
                            <span class="material-symbols-outlined text-6xl text-on-surface/20 mb-4">search</span>
                            <p class="text-on-surface-variant">Loading cases...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="bg-surface-container-high p-6 rounded-xl">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="material-symbols-outlined text-primary">pending</span>
                        <span class="text-sm font-bold text-primary">PENDING</span>
                    </div>
                    <div class="text-2xl font-bold text-on-surface" id="pendingCount">0</div>
                    <div class="text-xs text-on-surface-variant">Awaiting validation</div>
                </div>
                <div class="bg-surface-container-high p-6 rounded-xl">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="material-symbols-outlined text-secondary">verified</span>
                        <span class="text-sm font-bold text-secondary">VALIDATED</span>
                    </div>
                    <div class="text-2xl font-bold text-on-surface" id="validatedCount">0</div>
                    <div class="text-xs text-on-surface-variant">On matrix</div>
                </div>
                <div class="bg-surface-container-high p-6 rounded-xl">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="material-symbols-outlined text-tertiary">engineering</span>
                        <span class="text-sm font-bold text-tertiary">CLAIMED</span>
                    </div>
                    <div class="text-2xl font-bold text-on-surface" id="claimedCount">0</div>
                    <div class="text-xs text-on-surface-variant">Being solved</div>
                </div>
                <div class="bg-surface-container-high p-6 rounded-xl">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="material-symbols-outlined text-secondary">check_circle</span>
                        <span class="text-sm font-bold text-secondary">SOLVED</span>
                    </div>
                    <div class="text-2xl font-bold text-on-surface" id="solvedCount">0</div>
                    <div class="text-xs text-on-surface-variant">Resolved</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentViewMode = 'list'; // 'list' or 'matrix'

        // DOM elements
        const casesContainer = document.getElementById('casesContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const viewModeBtn = document.getElementById('viewModeBtn');
        const listModeBtn = document.getElementById('listModeBtn');

        // Stats counters
        const pendingCount = document.getElementById('pendingCount');
        const validatedCount = document.getElementById('validatedCount');
        const claimedCount = document.getElementById('claimedCount');
        const solvedCount = document.getElementById('solvedCount');

        // Load cases from API
        async function loadCases() {
            try {
                const response = await fetch(`${API_BASE}/cases`);
                const result = await response.json();

                if (result.success) {
                    displayCases(result.data);
                    updateStats(result.data);
                } else {
                    showError('Failed to load cases');
                }
            } catch (error) {
                console.error('Load error:', error);
                showError('Failed to connect to server');
            }
        }

        // Display cases based on current view mode
        function displayCases(cases) {
            if (currentViewMode === 'list') {
                displayListView(cases);
            } else {
                displayMatrixView(cases);
            }
        }

        // List view - simple card layout
        function displayListView(cases) {
            if (cases.length === 0) {
                casesContainer.innerHTML = `
                    <div class="flex items-center justify-center py-16">
                        <div class="text-center">
                            <span class="material-symbols-outlined text-6xl text-on-surface/20 mb-4">search_off</span>
                            <p class="text-on-surface-variant mb-4">No validated cases yet</p>
                            <a href="case_submission.html" class="px-6 py-3 bg-primary-container text-on-primary-container rounded-lg hover:bg-primary-container/80 transition-colors inline-flex items-center gap-2">
                                <span class="material-symbols-outlined">add</span>
                                Submit First Case
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const casesHTML = cases.map(caseItem => `
                <div class="bg-surface-container-high p-6 rounded-xl mb-4 hover:bg-surface-container-low transition-colors">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-2 py-1 text-xs font-bold rounded-full ${
                                    caseItem.status === 'validated' ? 'bg-secondary-container/20 text-secondary' :
                                    caseItem.status === 'claimed' ? 'bg-tertiary-container/20 text-tertiary' :
                                    caseItem.status === 'solved' ? 'bg-secondary/20 text-secondary' :
                                    'bg-primary-container/20 text-primary'
                                }">
                                    ${caseItem.status.toUpperCase()}
                                </span>
                                <span class="text-xs text-on-surface-variant">${caseItem.category}</span>
                            </div>
                            <h3 class="font-headline text-lg font-bold mb-2 italic">"${caseItem.summary}"</h3>
                            <p class="text-sm text-on-surface-variant mb-4 line-clamp-2">${caseItem.raw_input}</p>
                        </div>
                        <div class="text-right ml-4">
                            <div class="text-sm font-bold text-primary">Pain: ${caseItem.pain_level}/10</div>
                            <div class="text-sm font-bold text-secondary">Gap: ${caseItem.gap_score}/100</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4 text-xs text-on-surface-variant">
                            <span>Confirmations: ${caseItem.confirmation_count || 0}</span>
                            ${caseItem.cta ? `<span class="text-secondary">CTA: ${caseItem.cta}</span>` : ''}
                        </div>
                        <div class="flex gap-2">
                            ${caseItem.status === 'validated' ? `
                                <button onclick="claimCase(${caseItem.id})" class="px-3 py-1 bg-tertiary-container text-on-tertiary-container text-xs rounded hover:bg-tertiary-container/80 transition-colors">
                                    Claim
                                </button>
                            ` : ''}
                            ${caseItem.status === 'claimed' ? `
                                <button onclick="solveCase(${caseItem.id})" class="px-3 py-1 bg-secondary-container text-on-secondary-container text-xs rounded hover:bg-secondary-container/80 transition-colors">
                                    Mark Solved
                                </button>
                            ` : ''}
                            <button onclick="confirmCase(${caseItem.id})" class="px-3 py-1 bg-primary-container text-on-primary-container text-xs rounded hover:bg-primary-container/80 transition-colors">
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            casesContainer.innerHTML = casesHTML;
        }

        // Matrix view - simple dot visualization
        function displayMatrixView(cases) {
            if (cases.length === 0) {
                casesContainer.innerHTML = `
                    <div class="flex items-center justify-center py-16">
                        <div class="text-center">
                            <span class="material-symbols-outlined text-6xl text-on-surface/20 mb-4">scatter_plot</span>
                            <p class="text-on-surface-variant">No cases to map yet</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Simple matrix visualization
            casesContainer.innerHTML = `
                <div class="relative w-full h-96 bg-surface-container-low rounded-lg p-4">
                    <div class="absolute top-2 left-2 text-xs text-on-surface-variant">High Pain ←</div>
                    <div class="absolute bottom-2 left-2 text-xs text-on-surface-variant">Low Pain ←</div>
                    <div class="absolute top-2 right-2 text-xs text-on-surface-variant">→ High Gap</div>
                    <div class="absolute bottom-2 right-2 text-xs text-on-surface-variant">→ Low Gap</div>

                    ${cases.map(caseItem => {
                        // Position based on pain level and gap score
                        const x = (caseItem.gap_score / 100) * 80 + 10; // 10-90% width
                        const y = (1 - caseItem.pain_level / 10) * 80 + 10; // 10-90% height (inverted)

                        return `
                            <div class="absolute w-4 h-4 rounded-full cursor-pointer transform -translate-x-2 -translate-y-2 hover:scale-125 transition-transform"
                                 style="left: ${x}%; top: ${y}%;
                                        background-color: ${
                                            caseItem.status === 'solved' ? '#43e2d2' :
                                            caseItem.status === 'claimed' ? '#ffb68c' :
                                            '#ffb779'
                                        }"
                                 title="${caseItem.summary} (Pain: ${caseItem.pain_level}, Gap: ${caseItem.gap_score})"
                                 onclick="viewCaseDetails(${caseItem.id})">
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="mt-4 text-center text-xs text-on-surface-variant">
                    Click dots to view case details • Color: Amber=Problem, Orange=Claimed, Cyan=Solved
                </div>
            `;
        }

        // Update statistics
        function updateStats(cases) {
            const stats = {
                pending: cases.filter(c => c.status === 'pending').length,
                validated: cases.filter(c => c.status === 'validated').length,
                claimed: cases.filter(c => c.status === 'claimed').length,
                solved: cases.filter(c => c.status === 'solved').length
            };

            pendingCount.textContent = stats.pending;
            validatedCount.textContent = stats.validated;
            claimedCount.textContent = stats.claimed;
            solvedCount.textContent = stats.solved;
        }

        // Case actions
        async function confirmCase(caseId) {
            try {
                const response = await fetch(`${API_BASE}/cases/${caseId}/confirm`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    loadCases(); // Refresh the display
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Confirm error:', error);
                alert('Failed to confirm case');
            }
        }

        async function claimCase(caseId) {
            try {
                const response = await fetch(`${API_BASE}/cases/${caseId}/claim`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    loadCases(); // Refresh the display
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Claim error:', error);
                alert('Failed to claim case');
            }
        }

        async function solveCase(caseId) {
            try {
                const response = await fetch(`${API_BASE}/cases/${caseId}/solve`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    loadCases(); // Refresh the display
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Solve error:', error);
                alert('Failed to mark case as solved');
            }
        }

        function viewCaseDetails(caseId) {
            // For now, just show an alert. Could open a modal or navigate to detail page
            alert(`View details for case ${caseId}`);
        }

        function showError(message) {
            casesContainer.innerHTML = `
                <div class="flex items-center justify-center py-16">
                    <div class="text-center">
                        <span class="material-symbols-outlined text-6xl text-error mb-4">error</span>
                        <p class="text-on-surface-variant mb-4">${message}</p>
                        <button onclick="loadCases()" class="px-6 py-3 bg-primary-container text-on-primary-container rounded-lg hover:bg-primary-container/80 transition-colors">
                            Try Again
                        </button>
                    </div>
                </div>
            `;
        }

        // Event listeners
        refreshBtn.addEventListener('click', loadCases);
        viewModeBtn.addEventListener('click', () => {
            currentViewMode = 'matrix';
            loadCases();
        });
        listModeBtn.addEventListener('click', () => {
            currentViewMode = 'list';
            loadCases();
        });

        // Load cases on page load
        loadCases();
    </script>
</body>
</html>
