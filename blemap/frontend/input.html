<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Case - BleMap</title>
  <link rel="stylesheet" href="design-system.css">
</head>
<body>
  <div class="layout-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar-nav">
      <div>
        <div class="nav-brand">BleMap</div>
        <div class="nav-links">
          <a href="home.html" class="nav-link">Home</a>
          <a href="input.html" class="nav-link active">New Case</a>
          <a href="profile.html" class="nav-link">Profile</a>
          <a href="caseMatrix.html" class="nav-link">Case Matrix</a>
        </div>
      </div>
      <div class="nav-tagline">The Living Archive · Problem Submission</div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <span class="page-label">Problem Submission</span>
        <h1 class="page-title">Submit a Case</h1>
        <p class="page-description">Document a challenge or problem you'd like to explore collaboratively.</p>
      </div>

      <div id="message-box" class="mb-lg text-secondary"></div>

      <!-- Form Section -->
      <section class="section">
        <h2 class="section-title">Case Details</h2>
        <div class="card card-problem" style="padding: var(--spacing-lg);">
          <div class="mb-lg">
            <label class="label-medium text-muted mb-sm" style="display: block;">Problem Statement</label>
            <textarea id="post-input" placeholder="Describe the case, problem, or challenge you want to explore..." class="body-large"></textarea>
          </div>
          <button id="submit-post" class="btn btn-primary">Submit Case</button>
        </div>
      </section>

      <!-- Details Display -->
      <div id="case-details"></div>
    </main>
  </div>

  <script src="input.js"></script>
</body>
</html>
